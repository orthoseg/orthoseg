name: orthoseg-tf-dev
# This is the typical development environment for OrthoSeg that installs TensorFlow
# from conda-forge.
channels:
  - conda-forge
dependencies:
  - python =3.13
  - pip
  # required
  - gdal
  - geofileops
  - geopandas-base
  - keras
  - matplotlib-base
  - numpy
  - owslib
  - pandas
  - pillow
  - pycron
  - pygeoops
  - pyproj
  - rasterio
  - shapely
  - scikit-image
  - simplification
  - tensorflow
  # linting
  - mypy ==2.4.0
  - pandas-stubs
  - pre-commit
  - ruff ==0.16.10
  - types-pillow
  # testing
  - pytest
  - pytest-cov
  - pytest-order
  - pip:
    - segmodels-keras
    - types-shapely
    - types-tensorflow