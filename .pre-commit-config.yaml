ci:
    autofix_prs: false
    autoupdate_schedule: quarterly

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.10"
    hooks:
      # Format the code
      - id: ruff-format
        exclude: '^LICENSE\.MD$'
      # Lint the code
      - id: ruff-check
      #  args: [ --fix ] #, --unsafe-fixes ]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.4.0"
    hooks:
      - id: mypy