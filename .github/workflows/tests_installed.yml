# This workflow will install the latest version of geofileops and run will run its tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: TestsOnInstalled

on:
  workflow_dispatch:
  schedule:
    # every Monday at 5:40 AM
    - cron: "40 5 * * 1"
  push:
    paths:
      - ".github/workflows/tests_installed.yml"
  pull_request:
    paths: 
      - ".github/workflows/tests_installed.yml"

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  TestsOnInstalled:    
    name: ${{ matrix.env }} - python ${{ matrix.python }} - ${{ matrix.os }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        dev: [false]
        python: ["3.13"]
        env: ["environment-tf"]
        checkout_ref: ["v0.8.x"]
        install_extra_args: [""]
        include:
          - env: environment-tf-pip
            os: macos-latest
            dev: false
            python: "3.13"
            checkout_ref: "v0.8.x"
            install_extra_args: ""
          - env: environment-tf-pip
            os: windows-latest
            dev: false
            python: "3.13"
            checkout_ref: "v0.8.x"
            install_extra_args: ""
          - env: environment-tf-gpu-win
            os: windows-latest
            dev: false
            python: "3.10"
            checkout_ref: "v0.8.x"
            install_extra_args: ""

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.checkout_ref }}
          sparse-checkout: |
            ci
            tests
            sample_projects
      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.10.0-0"
          environment-file: ci/envs/${{ matrix.env }}.yml
          create-args: >-
            python=${{ matrix.python }}
            ${{ matrix.install_extra_args }}

      - name: Test
        env:
          TESTS_INSTALLED: "TRUE"
        run: |
          pytest --report-chars fRsxX --color=yes --durations=10 tests/
