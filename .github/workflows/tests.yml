# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, 0.** ]
  pull_request:
    branches: [ main, 0.** ]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/tests_installed.yml"
      - "*.md"
      - "*.yml"
  schedule:
    # Run every Tuesday at 2:40 UTC
    - cron: "40 2 * * 2"

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    name: ${{ matrix.env }} - python ${{ matrix.python }} - ${{ matrix.os }} - ${{ matrix.extra }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        dev: [false]
        python: ["3.10", "3.11", "3.12"]
        env: ["latest"]
        extra: [""]
        include:
          - env: latest
            os: ubuntu-latest
            dev: false
            python: "3.12"
            extra: tensorflow
          - env: latest
            os: ubuntu-latest
            dev: false
            python: "3.12"
            extra: jax
          - env: latest-tf-pip
            os: macos-latest
            dev: false
            python: "3.12"
          - env: latest-tf-pip
            os: windows-latest
            dev: false
            python: "3.12"
          - env: latest-tf-pip
            os: ubuntu-latest
            dev: false
            python: "3.12"
          - env: minimal
            os: windows-latest
            dev: false
            python: "3.10"
          - env: minimal
            os: ubuntu-latest
            dev: false
            python: "3.10"

    steps:
      - uses: actions/checkout@v7

      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.5.0-1"
          environment-file: ci/envs/${{ matrix.env }}.yml
          create-args: >-
            python=${{ matrix.python }}
            ${{ matrix.extra }}

      - name: Clear TensorFlow executable-stack flags
        if: runner.os == 'Linux' && matrix.env == 'latest' && matrix.python == '3.10'
        run: |
          set -euo pipefail
          tensorflow_package_dir="$(find "$CONDA_PREFIX" -type d -path '*/site-packages/tensorflow' -print -quit)"
          if [[ -z "$tensorflow_package_dir" ]]; then
            echo "Could not find the TensorFlow package in $CONDA_PREFIX" >&2
            exit 1
          fi
          mapfile -d '' -t tensorflow_libs < <(find "$CONDA_PREFIX" \
            \( -type f -o -type l \) \
            \( -path "$tensorflow_package_dir/*" -o -name 'libtensorflow_cc.so*' \) \
            \( -name '*.so' -o -name '*.so.*' \) -print0)
          if ((${#tensorflow_libs[@]} == 0)); then
            echo "Could not find TensorFlow shared libraries in $CONDA_PREFIX" >&2
            exit 1
          fi
          for tensorflow_lib in "${tensorflow_libs[@]}"; do
            if [[ ! -f "$tensorflow_lib" ]]; then
              echo "Skipping TensorFlow library path without a file target: $tensorflow_lib" >&2
              continue
            fi
            tensorflow_lib="$(readlink -f "$tensorflow_lib")"
            execstack="$(patchelf --print-execstack "$tensorflow_lib")"
            execstack="${execstack#execstack: }"
            case "$execstack" in
              X)
                echo "Clearing executable-stack flag from $tensorflow_lib"
                patchelf --clear-execstack "$tensorflow_lib"
                ;;
              -) ;;
              *)
                echo "Unexpected patchelf output '$execstack' for $tensorflow_lib" >&2
                exit 1
                ;;
            esac
          done

      - name: Set KERAS_BACKEND if needed
        if: matrix.extra == 'jax'
        run: echo "KERAS_BACKEND=jax" >> $GITHUB_ENV

      - name: Print installed versions and keras backend
        run: |
          python -c "import sys; print('Python version:', sys.version)"
          python -c "import orthoseg; print('orthoseg version:', orthoseg.__version__)"
          python -c "import tensorflow as tf; print('TensorFlow version:', tf.__version__)"
          python -c "import keras; print('Keras version:', keras.__version__); print('Keras backend:', keras.backend.backend())"

      - name: Test
        run: |
          pytest --report-chars fRsxX --color=yes --durations=10 --cov=orthoseg --cov-append --cov-report term-missing --cov-report xml tests/

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}