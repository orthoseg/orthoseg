# This is an environment with recent versions of dependencies while tensorflow is
# installed using pip.
#
# Notes:
#   - necessary for windows, as conda-forge does not provide a tf package for windows
name: orthoseg-tf-pip-dev
channels:
  - conda-forge
dependencies:
  - python <3.14
  - pip
  # required
  - astunparse  # Avoid it being installed via pip, otherwise segfault on windows
  - gdal
  - geofileops
  - geopandas-base
  - keras
  - matplotlib-base
  - numpy
  - owslib
  - pandas
  - pillow
  - pycron
  - pygeoops
  - pyproj
  - rasterio
  - shapely
  - scikit-image
  - simplification
  # optional, for CUDA support
  #- cudatoolkit ==12.3
  #- cudnn
  # linting
  - mypy ==2.4.0
  - pandas-stubs
  - pre-commit
  - ruff ==0.16.10
  - types-pillow
  # testing
  - pytest
  - pytest-cov
  - pytest-order
  - pip:
    - segmodels-keras
    - tensorflow
    - types-shapely
    - types-tensorflow