# This is the standard environment with recent version of all dependencies.
#
# Note: only supports linux-64, as tensorflow on conda-forge is only available for this
#       platform.
name: orthoseg
channels:
  - conda-forge
dependencies:
  - python <3.14
  - pip
  # required
  - gdal >3.10
  - geofileops >=0.11
  - geopandas-base >=1.0
  - matplotlib-base
  - numpy
  - owslib
  - pandas
  - pillow
  - pycron
  - pygeoops >=0.4
  - pyproj
  - rasterio
  - shapely >=2
  - scikit-image
  - simplification
  - tensorflow-gpu
  # testing
  - pytest
  - pytest-cov
  - pytest-order
  - pip:
    - segmodels-keras
    - orthoseg