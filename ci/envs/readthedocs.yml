# This is the environment used for building the documentation on ReadTheDocs.
name: orthosegdoc
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python =3.13
  - pip
  # required
  - gdal
  - geofileops
  - geopandas-base
  - matplotlib-base
  - numpy
  - owslib
  - pandas
  - pillow
  - pycron
  - pygeoops
  - pyproj
  - rasterio
  - shapely
  - scikit-image
  - simplification
  - tensorflow-cpu
  # docs
  - pydata-sphinx-theme
  - sphinx
  - sphinx-automodapi
  - sphinx-copybutton
  - pip:
    - segmodels-keras