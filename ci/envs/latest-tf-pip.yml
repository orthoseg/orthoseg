# This is an environment to test recent versions of dependencies while tensorflow is
# installed using pip.
#
# Notes:
#   - necessary for windows, as conda-forge does not provide a tf package for windows
name: orthoseg-latest-tf-pip
channels:
  - conda-forge
dependencies:
  - python <3.14
  - pip
  # required
  - astunparse  # Avoid it being installed via pip, otherwise segfault on windows
  - gdal
  - geofileops >=0.12
  - geopandas-base >=1.0
  - matplotlib-base
  - numpy
  - owslib
  - pandas
  - pillow
  - pycron
  - pygeoops >=0.4
  - pyproj
  - rasterio
  - shapely >=2
  - scikit-image
  - simplification
  # TensorFlow 2.19 can segfault on Windows with h5py versions above 3.13, seems solved
  # for newer versions of TensorFlow.
  # - sel(win): "h5py <3.14"
  # testing
  - pytest
  - pytest-cov
  - pytest-order
  - pip:
    - segmodels-keras
    - tensorflow >=2.10