# This is an environment to test recent versions of dependencies while tensorflow is
# installed using pip.
#
# Notes:
#   - necessary for windows, as conda-forge does not provide a tf package for windows
name: orthoseg
channels:
  - conda-forge
dependencies:
  - python <3.14
  - pip
  # required
  - gdal
  - geofileops >=0.12
  - geopandas-base >=1.0
  - matplotlib-base
  - numpy
  - owslib
  - pandas
  - pillow
  - pycron
  - pygeoops >=0.4
  - pyproj
  - rasterio
  - shapely >=2
  - scikit-image
  - simplification
  # testing
  - pytest
  - pytest-cov
  - pytest-order
  - pip:
    - segmodels-keras
    - tensorflow >=2.10
    - orthoseg >=0.6
