# This is an environment with recent versions of dependencies while tensorflow is
# installed using pip.
#
# Notes:
#   - necessary for windows, as conda-forge does not provide a tf package for windows
name: orthoseg
channels:
  - conda-forge
dependencies:
  - python <3.14
  - pip
  # required
  - astunparse  # Avoid it being installed via pip, otherwise segfault on windows
  - gdal
  - geofileops
  - geopandas-base
  - keras
  - matplotlib-base
  - numpy
  - owslib
  - pandas
  - pillow
  - pycron
  - pygeoops
  - pyproj
  - rasterio
  - shapely
  - scikit-image
  - simplification
  # testing
  - pytest
  - pytest-cov
  - pytest-order
  - pip:
    - segmodels-keras
    - tensorflow
    - orthoseg
