# This is an environment with the minimal versions supported.
#
# Note, specifically for windows, there is a seperate environment for GPU-enabled
# TensorFlow that pins even older versions in practice.
name: orthoseg-minimal-tf
channels:
  - conda-forge
dependencies:
  - python =3.12
  - pip
  # required
  - astunparse  # Avoid it being installed via pip, otherwise segfault on windows
  - gdal
  - geofileops
  - geopandas-base
  - keras =3.11
  - matplotlib-base
  - numpy
  - owslib
  - pandas
  - pillow
  - pycron
  - pygeoops
  - pyproj
  - rasterio
  - shapely
  - scikit-image
  - simplification
  - tensorflow =2.18  # First version supporting numpy 2
  # testing
  - pytest
  - pytest-cov
  - pytest-order
  - pip:
    - segmodels-keras