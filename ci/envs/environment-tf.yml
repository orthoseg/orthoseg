# This is the standard environment with recent versions of core dependencies.
#
# Note: if you want to use another backend, replace tensorflow with the desired backend
# package.
name: orthoseg
channels:
  - conda-forge
dependencies:
  - python <3.14
  - pip
  # required
  - gdal
  - geofileops >=0.12
  - geopandas-base >=1.0
  - matplotlib-base
  - numpy
  - owslib
  - pandas
  - pillow
  - pycron
  - pygeoops >=0.4
  - pyproj
  - rasterio
  - shapely >=2
  - scikit-image
  - simplification
  - tensorflow
  # testing
  - pytest
  - pytest-cov
  - pytest-order
  - pip:
    - segmodels-keras
    - orthoseg >=0.6